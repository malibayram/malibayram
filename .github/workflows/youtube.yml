name: Latest YouTube Videos
on:
  schedule:
    # Runs at 00:00, every 10 days
    - cron: "0 0 */10 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme-with-youtube:
    name: Update README with latest YouTube videos
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update YouTube videos
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          comment_tag_name: "BLOG-POST-LIST"
          feed_list: "https://www.youtube.com/feeds/videos.xml?channel_id=UC6xZXR2zd76Jx13-3u39wQA"
          max_post_count: 5
          template: "- [$title]($url)$newline"
          tag_post_pre_newline: true
